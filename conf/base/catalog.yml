# Every dataset the pipelines read or write.
# Anything NOT declared here lives in memory and vanishes at the end of a run.
# Docs: https://docs.kedro.org/en/stable/catalog-data/data_catalog_yaml_examples/

# -- 01_raw --------------------------------------------------------------------
# These two are already done - this is the pattern to copy for the rest.

members:
  type: pandas.CSVDataset
  filepath: data/01_raw/members.csv

checkins:
  type: pandas.ParquetDataset
  filepath: data/01_raw/checkins.parquet

