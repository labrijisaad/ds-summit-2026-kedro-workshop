# Build backend
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
requires-python = ">=3.11,<3.14"
name = "gym_churn"
description = "Hands-on workshop: turn a messy notebook into a production-ready Kedro project."
readme = "README.md"
dynamic = ["version"]

# Core dependencies
dependencies = [
    # kedro core + datasets + viz
    "kedro>=1.7.0",
    "kedro-datasets>=9.6.0",   # pandas, pickle, json, matplotlib dataset types
    "kedro-viz>=12.5.0",       # pipeline graph at http://127.0.0.1:4141/

    # data & ml : pinned for reproducibility of AUC
    "pandas>=2.2",
    "pyarrow>=16",                 # required for parquet support
    "matplotlib>=3.8",
    "scikit-learn>=1.5,<2",
]

# Dev dependencies  ->  uv sync --group dev
[dependency-groups]
dev = [
    # notebook interface
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",

    # linting / formatting / git hooks
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
gym-churn = "gym_churn.__main__:main"

[tool.setuptools.dynamic.version]
attr = "gym_churn.__version__"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# Kedro project settings
[tool.kedro]
package_name = "gym_churn"
project_name = "Gym Churn Workshop"
kedro_init_version = "1.7.0"
tools = "['Data Structure']"
example_pipeline = "False"
source_dir = "src"

# Ruff: lint + format Python only, leave notebooks and docs alone
[tool.ruff]
extend-exclude = ["*.ipynb", "notebooks", "data", "_assets"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]  # line length handled by formatter
